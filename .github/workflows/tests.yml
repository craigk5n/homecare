# HC-051: Run the PHPStan + PHPUnit gate on every push to main and
# every pull request. Tests run against in-memory SQLite (per
# tests/Integration/DatabaseTestCase) so no MySQL service is needed.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run on the same branch when a new push lands. The
# CI gate is fast (~60s); only the latest commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Analyse + Test (PHP ${{ matrix.php-version }})
    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php-version != '8.2' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # mysqli is needed because DbiAdapter / IntakeRepository import
          # the mysqli class even though the test path uses SQLite.
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, mysqli, zip
          coverage: ${{ matrix.php-version == '8.2' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies (with dev tools — phpunit, phpstan)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 'PHP-CS-Fixer (PER-CS lint)'
        if: matrix.php-version == '8.2'
        run: composer lint

      - name: 'PHPStan (level: max)'
        run: composer analyse

      - name: 'Psalm (taint analysis)'
        if: matrix.php-version == '8.2'
        run: composer psalm

      - name: PHPUnit (full suite)
        if: matrix.php-version != '8.2'
        run: composer test

      - name: PHPUnit + coverage (8.2 only)
        if: matrix.php-version == '8.2'
        run: composer test:coverage

      - name: Check coverage threshold
        if: matrix.php-version == '8.2'
        run: composer test:cov-check

      - name: Upload coverage artifact (8.2 only)
        if: matrix.php-version == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage/
            coverage.txt

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.2'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # HC-250: the same PHPUnit suite against a real PostgreSQL 17 server.
  # DatabaseTestCase switches backends on HOMECARE_TEST_DB; tests that
  # only make sense on SQLite skip themselves. Lint/analysis already run
  # in the matrix job above, so this job only runs PHPUnit.
  test-pgsql:
    name: PHPUnit on PostgreSQL 17 (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: homecare
          POSTGRES_PASSWORD: homecare
          POSTGRES_DB: homecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecare -d homecare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HOMECARE_TEST_DB: pgsql
      HOMECARE_TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=homecare_test
      HOMECARE_TEST_PG_USER: homecare
      HOMECARE_TEST_PG_PASSWORD: homecare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_pgsql for PgsqlDatabase, pgsql for the dbi4php driver test.
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, mysqli, pdo_pgsql, pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit (full suite, PostgreSQL)
        run: composer test
